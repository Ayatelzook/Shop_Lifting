{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shoplifting Prediction</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/style.css' %}">

    <!-- CSRF Token -->
    <meta name="csrf-token" content="{{ csrf_token }}">
</head>
<body>

<div class="container mt-5">
    <div class="form-container">
        <h1 class="text-center mb-4">🛒 Shoplifting Prediction</h1>

        <!-- Upload Form -->
        <form id="upload-form" method="post" enctype="multipart/form-data" class="needs-validation" novalidate>
            {% csrf_token %}
            <div class="mb-3">
                <label for="video" class="form-label">Select Video File:</label>
                <input type="file" name="video" id="video" class="form-control" accept="video/mp4" required>
                <div class="invalid-feedback">Please select a video file (MP4 only).</div>
            </div>
            <button type="submit" class="btn btn-primary w-100">Upload</button>
        </form>

        <!-- Loading Spinner -->
        <div id="loading-spinner" class="text-center mt-3" style="display: none;">
            <div class="spinner-border text-primary" role="status">
                <span class="visually-hidden">Processing...</span>
            </div>
            <p class="mt-2">Processing video...</p>
        </div>

        <!-- Result Section -->
        <div id="result-container" class="mt-4" style="display: none;">
            <div id="result-content" class="alert"></div>
            <button id="reset-btn" class="btn btn-secondary mt-2" style="display: none;">
                Upload Another Video
            </button>
        </div>
    </div>
</div>

<!-- Bootstrap JS -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.2/js/bootstrap.bundle.min.js"></script>

<!-- jQuery for AJAX -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>

<script>
    // Set CSRF token
    $.ajaxSetup({
        headers: {
            "X-CSRFToken": $("meta[name='csrf-token']").attr("content")
        }
    });

    $(document).ready(function () {
        // Handle form submission
        $('#upload-form').on('submit', function (e) {
            e.preventDefault();

            let formData = new FormData(this);

            // Hide previous result and show loading spinner
            $('#result-container').hide();
            $('#reset-btn').hide();
            $('#loading-spinner').fadeIn();

            $.ajax({
                url: '{% url "predict" %}', // Ensure this matches urls.py
                type: 'POST',
                data: formData,
                processData: false,
                contentType: false,
                success: function (response) {
                    console.log(response);
                    $('#loading-spinner').fadeOut(); // Hide loading spinner

                    if (response.success) {
                        let resultContainer = $('#result-content');
                        let confidence = (response.confidence * 100).toFixed(2); // Convert to percentage

                        // Styling based on prediction
                        resultContainer
                            .removeClass('alert-danger alert-success')
                            .addClass(response.prediction === 'Shop Lifter' ? 'alert-danger' : 'alert-success')
                            .html(`
                                <strong>Prediction:</strong> ${response.prediction}<br>
                                <strong>Confidence:</strong> ${confidence}%
                            `);
                    } else {
                        $('#result-content')
                            .removeClass('alert-success')
                            .addClass('alert-danger')
                            .html(`<strong>Error:</strong> ${response.error}`);
                    }

                    // Show result and reset button
                    $('#result-container').fadeIn();
                    $('#reset-btn').fadeIn();
                },
                error: function (xhr) {
                    console.log(xhr);
                    $('#loading-spinner').fadeOut(); // Hide loading spinner

                    $('#result-content')
                        .removeClass('alert-success')
                        .addClass('alert-danger')
                        .html(`<strong>Error:</strong> ${xhr.responseJSON?.error || 'Unknown error'}`);
                    $('#result-container').fadeIn();
                    $('#reset-btn').fadeIn();
                }
            });
        });

        // Reset Button Logic
        $('#reset-btn').on('click', function () {
            $('#upload-form')[0].reset(); // Reset form
            $('#result-container').fadeOut();
            $('#result-content').html('');
            $('#reset-btn').fadeOut();
        });
    });
</script>

</body>
</html>
